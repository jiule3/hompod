name: Build HomePod Bridge EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build HomePod Bridge
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build

      - name: Collect EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          if (Test-Path "target\release\homepod-bridge-desktop.exe") {
            Copy-Item "target\release\homepod-bridge-desktop.exe" "dist\HomePod-Bridge.exe"
          }

          Get-ChildItem "target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "dist\HomePod-Bridge-Setup.exe"
          }

          Get-ChildItem dist

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: HomePod-Bridge-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
