name: Build HomePod Bridge Realtime Balanced

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Prepare TuneBlade realtime core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $airSend = Join-Path $env:RUNNER_TEMP 'AirSend'
          $airplay2 = Join-Path $env:RUNNER_TEMP 'airplay2-rs'

          git clone --quiet https://github.com/Pabldi08/AirSend $airSend
          git -C $airSend checkout --quiet ee55c8d5d2aa15959bd7e936a73fe9ff7d487758

          git clone --quiet https://github.com/Pabldi08/airplay2-rs $airplay2
          git -C $airplay2 checkout --quiet 1baeaae336ca3a9828e732500082f5fd1767d2fd

          # 1. Sender live audio buffer: 2000 ms -> 100 ms.
          $streamerPath = Join-Path $airplay2 'crates/airplay-audio/src/streamer.rs'
          $streamer = Get-Content $streamerPath -Raw
          $oldBuffer = 'buffer: AudioBuffer::new(audio_format, 2000),'
          $newBuffer = 'buffer: AudioBuffer::new(audio_format, 180),'
          if (-not $streamer.Contains($oldBuffer)) { throw 'Expected 2000 ms AudioBuffer line was not found.' }
          $streamer = $streamer.Replace($oldBuffer, $newBuffer)
          Set-Content -Path $streamerPath -Value $streamer -Encoding utf8 -NoNewline

          # 2. HomePod Gaming receiver window: 250-1000 ms -> 100-350 ms.
          #    PCM handoff queue: 64 -> 8.
          $streamingPath = Join-Path $airSend 'crates/airplay-core/src/streaming.rs'
          $streaming = Get-Content $streamingPath -Raw
          $oldGaming = 'LatencyProfile::Gaming => (11_025, 44_100), // ~250 ms – 1 s'
          $newGaming = 'LatencyProfile::Gaming => (6_615, 22_050), // balanced ~150 ms – 500 ms'
          if (-not $streaming.Contains($oldGaming)) { throw 'Expected Gaming latency range was not found.' }
          $streaming = $streaming.Replace($oldGaming, $newGaming)

          $oldQueue = 'const QUEUE_CAPACITY: usize = 64;'
          $newQueue = 'const QUEUE_CAPACITY: usize = 16;'
          if (-not $streaming.Contains($oldQueue)) { throw 'Expected QUEUE_CAPACITY=64 was not found.' }
          $streaming = $streaming.Replace($oldQueue, $newQueue)
          Set-Content -Path $streamingPath -Value $streaming -Encoding utf8 -NoNewline

          # 3. Point AirSend to patched local airplay2-rs.
          $capTomlPath = Join-Path $airSend 'crates/airplay-core/Cargo.toml'
          $capToml = Get-Content $capTomlPath -Raw
          $ap2 = $airplay2.Replace('\', '/')
          $rev = '1baeaae336ca3a9828e732500082f5fd1767d2fd'
          $gitUrl = 'https://github.com/Pabldi08/airplay2-rs'

          $pairs = @(
            @("ap2rs-pairing = { package = `"airplay-pairing`", git = `"$gitUrl`", rev = `"$rev`" }", "ap2rs-pairing = { package = `"airplay-pairing`", path = `"$ap2/crates/airplay-pairing`" }"),
            @("ap2rs-core = { package = `"airplay-core`", git = `"$gitUrl`", rev = `"$rev`" }", "ap2rs-core = { package = `"airplay-core`", path = `"$ap2/crates/airplay-core`" }"),
            @("ap2rs-client = { package = `"airplay-client`", git = `"$gitUrl`", rev = `"$rev`" }", "ap2rs-client = { package = `"airplay-client`", path = `"$ap2/crates/airplay-client`" }"),
            @("ap2rs-audio = { package = `"airplay-audio`", git = `"$gitUrl`", rev = `"$rev`" }", "ap2rs-audio = { package = `"airplay-audio`", path = `"$ap2/crates/airplay-audio`" }")
          )
          foreach ($pair in $pairs) {
            if (-not $capToml.Contains($pair[0])) { throw "Expected AirSend dependency line was not found: $($pair[0])" }
            $capToml = $capToml.Replace($pair[0], $pair[1])
          }
          Set-Content -Path $capTomlPath -Value $capToml -Encoding utf8 -NoNewline

          # 4. Upgrade repository backend from old 2-argument call to the
          #    newer 3-argument latency API.
          $backendPath = 'crates/airplay-backend/src/lib.rs'
          $backend = Get-Content $backendPath -Raw
          if (-not $backend.Contains('Some(receiver_latency)')) {
            $oldCommentPattern = '(?s)\s*// The pinned AirSend API fixes its receiver latency internally.*?let _requested_profile = config\.profile;\s*'
            $backend = [regex]::Replace($backend, $oldCommentPattern, "`n")

            $oldCallPattern = '(?s)let handle = cap_core::streaming::open_live_stream\(\s*descriptor,\s*Some\(config\.volume\.clamp\(0\.0, 1\.0\)\),\s*\)'
            $receiverLines = @(
              '        let receiver_latency = match config.profile {',
              '            LatencyProfile::Ultra => cap_core::LatencyProfile::Gaming,',
              '            LatencyProfile::Low => cap_core::LatencyProfile::Video,',
              '            LatencyProfile::Stable => cap_core::LatencyProfile::Music,',
              '        };',
              '',
              '        let handle = cap_core::streaming::open_live_stream(',
              '            descriptor,',
              '            Some(config.volume.clamp(0.0, 1.0)),',
              '            Some(receiver_latency),',
              '        )'
            )
            $receiverBlock = $receiverLines -join "`n"
            $patched = [regex]::Replace($backend, $oldCallPattern, $receiverBlock)
            if ($patched -eq $backend) { throw 'Could not patch old 2-argument AirSend backend call.' }
            $backend = $patched
            Set-Content -Path $backendPath -Value $backend -Encoding utf8 -NoNewline
          }

          # 5. Override cap-core to use patched local AirSend.
          $capPath = (Join-Path $airSend 'crates/airplay-core').Replace('\', '/')
          $rootCargo = Get-Content 'Cargo.toml' -Raw
          $patchHeader = '[patch."https://github.com/Pabldi08/AirSend"]'
          if (-not $rootCargo.Contains($patchHeader)) {
            Add-Content -Path 'Cargo.toml' -Encoding utf8 -Value "`n$patchHeader`ncap-core = { path = `"$capPath`" }`n"
          }

          Write-Host '=== TuneBlade realtime patch verification ==='
          Select-String -Path $streamerPath -Pattern 'AudioBuffer::new'
          Select-String -Path $streamingPath -Pattern 'QUEUE_CAPACITY'
          Select-String -Path $streamingPath -Pattern 'balanced ~150 ms'
          Select-String -Path $backendPath -Pattern 'Some\(receiver_latency\)'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build HomePod Bridge
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build

      - name: Collect EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (Test-Path "target\release\homepod-bridge-desktop.exe") {
            Copy-Item "target\release\homepod-bridge-desktop.exe" "dist\HomePod-Bridge.exe"
          }
          Get-ChildItem "target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "dist\HomePod-Bridge-Setup.exe"
          }
          Get-ChildItem dist

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: HomePod-Bridge-Realtime-Balanced-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
